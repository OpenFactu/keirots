name: Firmware
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2.0.0
        with:
          version: '1.3.1'
      - name: Install pinned board and library
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12
          arduino-cli lib install MFRC522@1.4.12
      - name: Build and validate release
        run: |
          mkdir -p work/keirost-rfid-fichaje
          cp keirost-rfid-fichaje.ino work/keirost-rfid-fichaje/
          cp -r src work/keirost-rfid-fichaje/
          arduino-cli compile --fqbn esp32:esp32:esp32doit-devkit-v1:UploadSpeed=115200 --build-path work/build work/keirost-rfid-fichaje
          node scripts/package-release.mjs work/build "$HOME/.arduino15/packages/esp32/hardware/esp32/3.3.12"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: keirost-esp32-firmware
          path: release/
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --title "Keirost $GITHUB_REF_NAME" --notes-file docs/release-notes.md
